<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quorum Chat</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>
  <div class="chat-container">

    <!-- LEFT PANEL - FRIENDS LIST -->
    <div class="friends-panel">
      <div class="search-bar">
        <input type="text" id="searchUser" placeholder="Search by username or email">
      </div>
      <div id="friendsList" class="friends-list"></div>
    </div>

    <!-- RIGHT PANEL - CHAT AREA -->
    <div class="chat-area">
      <div class="chat-header">
        <span id="chatWithName">Select a friend</span>
        <button id="settingsBtn" class="settings-btn"><i class='bx bx-cog'></i></button>
      </div>

      <div id="chatMessages" class="chat-messages"></div>

      <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Type a message...">
        <button id="sendBtn"><i class='bx bx-send'></i></button>
      </div>
    </div>

    <!-- SETTINGS PANEL -->
    <div class="settings-panel" id="settingsPanel">
      <button id="closeSettingsBtn" class="close-btn"><i class='bx bx-arrow-back'></i></button>
      <h3>Settings</h3>
      <div class="profile-edit">
        <img id="profilePreview" src="pic.jpg" alt="Profile Preview" style="width:60px;height:60px;border-radius:50%;margin-bottom:10px;">
        <input type="text" id="updateName" placeholder="Change your name">
        <label class="file-label">
          <i class='bx bx-image'></i> Choose profile picture
          <input type="file" id="updatePic" accept="image/*" hidden>
        </label>
        <button id="saveProfileBtn" class="glow-btn">Save</button>
      </div>
      <div class="settings-bottom">
        <button id="logoutBtn" class="glow-btn"><i class='bx bx-log-out'></i> Logout</button>
        <div class="credit">
          <img src="pic.jpg" alt="Creator Pic">
          <span>Created by Minhazul Islam</span>
          <a href="https://minhazul-islam-maain1.github.io/MINHAZ-CARD/" target="_blank" class="social-btn">Social</a>
        </div>
      </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast" class="toast"></div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="chat.js"></script>
</body>
</html>
